# Hängt an jedes veröffentlichte Release je Skill eine ZIP für den Upload in
# claude.ai (Ordner des Skills als Wurzel der ZIP).
# Release anlegen: GitHub → Releases → Draft a new release → Tag vX.Y.Z → Publish.
name: Release-ZIPs

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIPs bauen
        run: |
          mkdir -p dist
          for skill in plugins/*/skills/*/; do
            name=$(basename "$skill")
            (cd "$(dirname "$skill")" && zip -r "$GITHUB_WORKSPACE/dist/$name.zip" "$name")
          done
          ls -l dist
      - name: An das Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.zip --clobber
